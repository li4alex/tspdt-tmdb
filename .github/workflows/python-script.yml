name: Daily Python script run to replace table json
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
      tags:
        description: 'Test scenario tags'  
      environment:
        type: environment
        description: Select the environment
  # schedule:
  #   - cron: "23 03 * * *"

jobs:
  python-script:
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./utils/requirements.txt
      - name: Check out the repository to the runner
        uses: actions/checkout@v5
      - name: Run Python script
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          MIN_TABLE_JSON_SIZE_MB = 44
          MIN_TABLE_JSON_SIZE_BYTES=$((MIN_TABLE_JSON_SIZE_MB * 1024 * 1024))
          FILE_SIZE = $(du -b "./public/table.json" | awk '{print $1}')
          git config user.email github-actions
          git config user.name github-actions@github.com
          git pull
          git push
          python ./utils/providers.py
          # if ((FILE_SIZE < MIN_TABLE_JSON_SIZE_BYTES)); then
          git add .
          git commit -m "New json"
          git push
          # fi